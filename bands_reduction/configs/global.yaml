# Config global — bands_reduction (compartible)
# Paths de máquina: opcional configs/local.yaml (gitignored; ver local.yaml.example)
# ⚙️ AJUSTAR rutas y umbrales antes de producción

project:
  name: bands_reduction
  year: 2015            # año de referencia del mosaico LULC
  n_bands_full: 184
  # Originalmente 8 ecorregiones; se dividieron y quedaron 15
  n_ecoregions: 15          # IDs 1–15 en el TIF alineado (0 = nodata)
  mosaic_year: 2015

# Defaults; override en configs/local.yaml
paths:
  # Alias usados por scripts ME (find_mosaic_tile) y PE (resolve_mosaic_path)
  mosaic: /home/lserey/mapbiomas_land/test/mosaics/mosaics_184bands
  mosaics_dir: /home/lserey/mapbiomas_land/test/mosaics/mosaics_184bands
  mosaic_filename_template: "TMP-CHILE-{tile}-{year}-SBAND-184B.tif"
  # Muestras PE (NPZ con X/rows/cols; y se adjunta desde labels)
  samples: /home/lserey/mapbiomas_land/tmp/bands_reduction_pe/samples
  samples_file: /home/lserey/mapbiomas_land/tmp/bands_reduction_pe/samples/E2_19KCQ_2015_n50000.npz
  labels: /home/lserey/mapbiomas_land/ancillary_data/landcover_col2/classification_2015.tif
  ecoregions: /home/lserey/mapbiomas_land/ancillary_data/ecorregiones_col3_30m_alineado_lulc.tif
  results_dir: results      # relativo al repo bands_reduction/

# Pipeline oficial: eco unificada (merge tiles → máscara → |r| → clusters → reps)
sampling:
  n_pixels_eco: 100000      # total píxeles por ecorregión
  balance: equal_per_tile   # equal_per_tile | area_proportional
  random_state: 42
  # legacy / piloto por tile
  n_pixels: 50000
  per_tile_n_pixels: 30000

clustering:
  distance_threshold: 0.10  # d = 1-|r| ↔ |r|>=0.90 (default single-cut)
  linkage: average
  corr_thresholds: [0.95, 0.90, 0.85]
  # piloto legacy (scripts/legacy/)
  coassoc_threshold: 0.70
  coassoc_linkage: average

representatives:
  method: central_mean_abs_r
  tie_break: min_band_index
  family_rescue: true

# JM (Jeffries-Matusita): clases a excluir del ranking núcleo
# 33=agua, 34=hielo/nieve (ya tienen reglas / no deben dominar la selección)
jm:
  exclude_classes: [33, 34]
  min_count: 20

qa:
  # Criterio de aceptación: caída máxima vs. full-band RF
  max_oa_drop: 0.02     # ⚙️ AJUSTAR (1–2 %)
  max_kappa_drop: 0.02  # ⚙️ AJUSTAR
  cv_folds: 5           # ⚙️ AJUSTAR

pipeline:
  official:
    - inventory           # 06
    - sample_eco_merged   # 10
    - cluster_eco         # 11
    - select_reps         # 12
  start_unsupervised: true
  stages:
    - spectral_cluster  # 1 WaLuDi + BandClust / corr |r|>=0.9
    - jm_refine         # 2 Jeffries-Matusita (sobre 184 y sobre clustering)
    - boruta            # 3
  qa_after: [jm_refine, boruta]
  consolidation:
    - intersection      # mínimo común entre ecorregiones
    - union             # unión entre ecorregiones
    - corr_outside      # correlación de bandas fuera de intersección/unión
    - eval_union        # evaluación de la unión global
  qa_consolidation: true

# Boruta (scripts/09_run_boruta.py) — ⚙️ AJUSTAR
boruta:
  max_iter: 50
  n_estimators: 200
  perc: 100            # 100 = umbral = max importancia de sombras
  alpha: 0.05

round_2_optional:
  metaheuristics: false
  autoencoder: false
